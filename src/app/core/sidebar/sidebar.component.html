<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #drawer class="sidenav" fixedInViewport
      [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
      [mode]="(isHandset$ | async) ? 'over' : 'side'"
      [opened]="(isHandset$ | async) === false">
    <mat-toolbar>Menu</mat-toolbar>
    <mat-nav-list>
      <a mat-list-item routerLink="/overview">Overview</a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar color="primary">
      @if (isHandset$ | async) {
        <button
          type="button"
          aria-label="Toggle sidenav"
          mat-icon-button
          (click)="drawer.toggle()">
          <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
        </button>
      }
      <a routerLink="/" style="text-decoration:none; color:inherit"><h3 style="margin:0">Blog</h3></a>
      <span class="spacer"></span>
      <div style="display:flex; gap:12px; align-items:center">
        <button mat-button *ngIf="canAddBlog()" routerLink="/add-blog">Add Blog</button>
        <span *ngIf="isAuthenticated()">{{ username() }}</span>
        <button mat-button *ngIf="!isAuthenticated()" (click)="login()">Login</button>
        <button mat-button *ngIf="isAuthenticated()" (click)="logout()">Logout</button>
      </div>
    </mat-toolbar>
    <main class="content">
      <ng-content></ng-content>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
